<div class="box">
  <h2 class="st">Ürün Grupları</h2>
  <div class="cats">
    <div class="cc" onclick="kat('all','Tüm Ürünlerimiz')"><div style="font-size:28px">✨</div><b>Tümü</b></div>
    <div class="cc" onclick="kat('baharat','Baharat Çeşitleri')"><div style="font-size:28px">🌶️</div><b>Baharat</b></div>
    <div class="cc" onclick="kat('kuruyemis','Kuruyemiş Çeşitleri')"><div style="font-size:28px">🥜</div><b>Kuruyemiş</b></div>
    <div class="cc" onclick="kat('kahve','Kahve Çeşitleri')"><div style="font-size:28px">☕</div><b>Kahve</b></div>
    <div class="cc" onclick="kat('lokum','Lokum & Şekerleme')"><div style="font-size:28px">🍬</div><b>Lokum</b></div>
    <div class="cc" onclick="kat('cay','Çay Çeşitleri')"><div style="font-size:28px">🍵</div><b>Çay</b></div>
    <div class="cc" onclick="kat('diger','Salça & Yöresel Ürünler')"><div style="font-size:28px">🍅</div><b>Salça & Diğer</b></div>
  </div>

  <h2 class="st" id="urunler">Tüm Ürünlerimiz</h2>
  <div class="grid" id="list"></div>
</div>

<footer>
  <p><strong style="color:#eab308">ADEM KURUYEMİŞ BAHARAT</strong> — Kayapınar / Diyarbakır</p>
  <p style="margin-top:8px;font-size:12px">© 2026 Adem Kuruyemiş Baharat. Tüm Hakları Saklıdır.</p>
</footer>

<div class="modal" id="mdl">
  <div class="mc">
    <div style="display:flex;justify-content:space-between;margin-bottom:10px">
      <h3>Sepetim</h3>
      <button onclick="kapat()" style="border:none;background:none;font-size:22px;cursor:pointer">&times;</button>
    </div>
    <div id="items"><p style="text-align:center;color:#888">Sepetiniz boş.</p></div>
    <div style="margin-top:12px;font-weight:700;text-align:right">Toplam: <span id="tot">0</span> TL</div>
    <button class="wbtn" onclick="wp()">📱 WhatsApp ile Sipariş Ver</button>
  </div>
</div>

<script>
const urunler=[
  {id:1, n:"Hakiki Güneşte Kurutulmuş İsot", w:"1 Kg", p:320, c:"baharat", img:"IMG_3517.JPEG", i:"🌶️", b:"Çok Satan"},
  {id:2, n:"Kırmızı İpek Pulbiber", w:"1 Kg", p:500, c:"baharat", img:"", i:"🔥", b:"Taze"},
  {id:3, n:"Yöresel Ekşi Sumak", w:"1 Kg", p:250, c:"baharat", img:"", i:"🍷", b:""},
  {id:4, n:"Tane Karabiber", w:"500 gr", p:240, c:"baharat", img:"", i:"⚫", b:""},
  {id:5, n:"Antep Fıstığı (Kavrulmuş)", w:"1 Kg", p:650, c:"kuruyemis", img:"", i:"🥜", b:"Özel"},
  {id:6, n:"Taze Kavrulmuş Badem İçi", w:"1 Kg", p:480, c:"kuruyemis", img:"", i:"🌰", b:""},
  {id:7, n:"Taze Çekilmiş Türk Kahvesi", w:"500 gr", p:220, c:"kahve", img:"", i:"☕", b:"Taze Çekim"},
  {id:8, n:"Yöresel Menengiç Kahvesi", w:"500 gr", p:190, c:"kahve", img:"", i:"🤎", b:"Yöresel"},
  {id:9, n:"Çifte Kavrulmuş Fıstıklı Lokum", w:"1 Kg", p:340, c:"lokum", img:"", i:"🍬", b:"Çok Satan"},
  {id:10, n:"Seylan İthal Çay", w:"1 Kg", p:360, c:"cay", img:"", i:"🍵", b:""},
  {id:11, n:"Ev Yapımı Domates & Biber Salçası", w:"1 Kg", p:180, c:"diger", img:"", i:"🍅", b:"Doğal"}
];

let sepet=[];
function ciz(l){
  const g=document.getElementById('list');g.innerHTML='';
  l.forEach(u=>{
    const gorsel = u.img ? `<img src="${u.img}" alt="${u.n}" onerror="this.outerHTML='<span style=font-size:54px>${u.i}</span>'">` : `<span style="font-size:54px">${u.i}</span>`;
    g.innerHTML+=`<div class="card"><div class="pimg">${u.b?`<span class="bdg">${u.b}</span>`:''}${gorsel}</div><div class="pt">${u.n}</div><div class="pw">${u.w}</div><div class="pp">₺ ${u.p}</div><button class="abtn" onclick="ekle(${u.id})">SEPETE EKLE</button></div>`;
  });
}
function kat(c, baslik){
  if(baslik) document.getElementById('urunler').innerText = baslik;
  ciz(c==='all'?urunler:urunler.filter(u=>u.c===c));
}
function ara(){
  const t=document.getElementById('q').value.toLowerCase();
  document.getElementById('urunler').innerText = t ? `"${t}" için arama sonuçları` : "Tüm Ürünlerimiz";
  ciz(urunler.filter(u=>u.n.toLowerCase().includes(t)));
}
function ekle(id){const u=urunler.find(x=>x.id===id);sepet.push(u);guncelle();alert(u.n+" sepete eklendi!")}
function guncelle(){
  document.getElementById('cnt').innerText=sepet.length;
  const it=document.getElementById('items'),tot=document.getElementById('tot');
  if(!sepet.length){it.innerHTML='<p style="text-align:center;color:#888">Sepetiniz boş.</p>';tot.innerText='0';return}
  let t=0;it.innerHTML='';
  sepet.forEach((x,idx)=>{t+=x.p;it.innerHTML+=`<div class="ci"><div><b>${x.n}</b><br><small>${x.w} - ${x.p} TL</small></div><button onclick="sil(${idx})" style="color:red;border:none;background:none;cursor:pointer">Sil</button></div>`});
  tot.innerText=t;
}
function sil(i){sepet.splice(i,1);guncelle()}
function ac(){document.getElementById('mdl').style.display='flex'}
function kapat(){document.getElementById('mdl').style.display='none'}
function wp(){
  if(!sepet.length)return alert("Önce sepete ürün ekleyin.");
  const tel="905000000000";
  let m="Merhaba Adem Kuruyemiş Baharat, sipariş vermek istiyorum:%0A%0A",t=0;
  sepet.forEach(x=>{m+=`- ${x.n} (${x.w}): ${x.p} TL%0A`;t+=x.p});
  m+=`%0A*Toplam:* ${t} TL`;
  window.open(`https://wa.me{tel}?text=${m}`,'_blank');
}
ciz(urunler);
</script>
</body>
</html>
