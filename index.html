<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Adem Baharat | Doğal & Yöresel Lezzetler</title>
<style>
:root {
  --brand: #f97316;
  --brand-dark: #ea580c;
  --brand-soft: #fff7ed;
  --dark: #18181b;
  --text: #27272a;
  --muted: #71717a;
  --bg: #fafafa;
  --border: #e4e4e7;
  --wa: #25D366;
}
* { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, -apple-system, sans-serif; }
body { background: var(--bg); color: var(--text); line-height: 1.45; }

/* Yönetici Çubuğu */
.admin-bar {
  display: none; background: #18181b; color: #fff; padding: 10px 14px;
  justify-content: center; align-items: center; gap: 12px; flex-wrap: wrap;
  position: sticky; top: 0; z-index: 999; border-bottom: 2px solid var(--brand);
}
body.admin-mode .admin-bar { display: flex; }
.save-btn { background: var(--brand); color: #fff; border: none; padding: 7px 15px; border-radius: 6px; font-weight: 700; cursor: pointer; }
.exit-btn { background: #3f3f46; color: #fff; border: none; padding: 7px 12px; border-radius: 6px; cursor: pointer; }

/* Üst Duyuru Barı */
.promo-bar {
  background: var(--brand); color: #fff; text-align: center;
  padding: 7px 12px; font-size: 0.82rem; font-weight: 700; letter-spacing: 0.3px;
}

/* Header */
header { background: #fff; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 100; }
body.admin-mode header { top: 46px; }
.header-inner {
  max-width: 1280px; margin: auto; padding: 14px 16px;
  display: flex; align-items: center; justify-content: space-between; gap: 16px; flex-wrap: wrap;
}
.logo { text-decoration: none; display: flex; flex-direction: column; }
.logo-title { font-size: 1.5rem; font-weight: 900; color: var(--brand); letter-spacing: -0.5px; line-height: 1; }
.logo-sub { font-size: 0.72rem; color: var(--muted); font-weight: 600; margin-top: 3px; }

.search-box { flex: 1; min-width: 220px; max-width: 480px; position: relative; }
.search-box input {
  width: 100%; padding: 10px 16px; border: 1.5px solid var(--border);
  border-radius: 99px; font-size: 0.9rem; outline: none; background: #f4f4f5; transition: 0.2s;
}
.search-box input:focus { border-color: var(--brand); background: #fff; }

.header-actions { display: flex; align-items: center; gap: 10px; }
.wa-top {
  background: #f4f4f5; color: var(--text); text-decoration: none;
  padding: 9px 14px; border-radius: 99px; font-size: 0.84rem; font-weight: 700;
}
.cart-btn {
  background: var(--brand); color: #fff; border: none; padding: 10px 18px;
  border-radius: 99px; font-weight: 700; font-size: 0.9rem; cursor: pointer;
  display: flex; align-items: center; gap: 6px; transition: 0.2s;
}
.cart-btn:hover { background: var(--brand-dark); }

/* Kategori Menüsü */
.cat-wrap { background: #fff; border-bottom: 1px solid var(--border); }
.cat-nav {
  max-width: 1280px; margin: auto; padding: 10px 16px;
  display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none;
}
.cat-nav::-webkit-scrollbar { display: none; }
.cat-btn {
  background: transparent; border: 1px solid transparent; padding: 7px 14px;
  border-radius: 8px; font-size: 0.86rem; font-weight: 600; color: var(--text);
  cursor: pointer; white-space: nowrap; transition: 0.2s;
}
.cat-btn:hover { background: var(--brand-soft); color: var(--brand); }
.cat-btn.active { background: var(--brand); color: #fff; }

/* Banner Alanı */
.hero {
  max-width: 1280px; margin: 18px auto; padding: 0 16px;
  display: grid; grid-template-columns: 1.4fr 1fr; gap: 14px;
}
.banner-card {
  position: relative; height: 220px; border-radius: 14px; overflow: hidden;
  background: linear-gradient(135deg, #f97316, #c2410c); color: #fff;
}
.banner-card.alt { background: linear-gradient(135deg, #27272a, #18181b); }
.banner-card img { width: 100%; height: 100%; object-fit: cover; display: block; opacity: 0.85; }
.banner-overlay {
  position: absolute; inset: 0; background: linear-gradient(to top, rgba(0,0,0,0.75), transparent);
  padding: 20px; display: flex; flex-direction: column; justify-content: flex-end;
}
.banner-overlay h2 { font-size: 1.35rem; font-weight: 800; margin-bottom: 4px; }
.banner-overlay p { font-size: 0.88rem; opacity: 0.9; }
.up-btn {
  display: none; position: absolute; top: 10px; right: 10px; z-index: 10;
  background: #18181b; color: #fff; border: 1.5px solid #fff;
  padding: 5px 10px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; cursor: pointer;
}
body.admin-mode .up-btn { display: block; }

/* Ürün Listesi */
.container { max-width: 1280px; margin: 20px auto 50px; padding: 0 16px; }
.section-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 16px; }
.section-head h3 { font-size: 1.25rem; font-weight: 800; color: var(--dark); }
.prod-count { font-size: 0.85rem; color: var(--muted); font-weight: 600; }

.grid {
  display: grid; grid-template-columns: repeat(auto-fill, minmax(175px, 1fr)); gap: 14px;
}
@media(min-width: 640px) {
  .grid { grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 18px; }
}

/* Ürün Kartı (Turuncu Kuruyemiş Tarzı) */
.card {
  background: #fff; border: 1px solid var(--border); border-radius: 12px;
  overflow: hidden; display: flex; flex-direction: column; position: relative;
  transition: transform 0.15s, box-shadow 0.15s;
}
.card:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(0,0,0,0.06); }
.badge-cat {
  position: absolute; top: 8px; left: 8px; z-index: 2;
  background: rgba(255,255,255,0.92); color: var(--text);
  font-size: 0.68rem; font-weight: 700; padding: 3px 8px; border-radius: 6px;
}
.badge-out {
  position: absolute; top: 8px; right: 8px; z-index: 2;
  background: #ef4444; color: #fff; font-size: 0.68rem; font-weight: 700;
  padding: 3px 8px; border-radius: 6px;
}
.card-img {
  height: 180px; background: #f4f4f5; position: relative;
  display: flex; align-items: center; justify-content: center; overflow: hidden;
}
.card-img img { width: 100%; height: 100%; object-fit: cover; }
.placeholder-icon { font-size: 2.5rem; opacity: 0.35; }

.card-body { padding: 12px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
.card-title { font-size: 0.94rem; font-weight: 700; color: var(--dark); margin-bottom: 10px; line-height: 1.3; }

/* 500 gr ve 1 kg Kutucukları */
.gram-box { display: flex; gap: 6px; margin-bottom: 10px; }
.gram-btn {
  flex: 1; padding: 6px 4px; border: 1.5px solid var(--border); background: #fff;
  border-radius: 6px; font-size: 0.78rem; font-weight: 700; color: var(--muted);
  cursor: pointer; text-align: center; transition: 0.15s;
}
.gram-btn.active {
  border-color: var(--brand); background: var(--brand-soft); color: var(--brand-dark);
}
.unit-tag {
  display: inline-block; font-size: 0.75rem; font-weight: 600; color: var(--muted);
  background: #f4f4f5; padding: 4px 8px; border-radius: 6px; margin-bottom: 10px; width: fit-content;
}

.card-footer {
  display: flex; align-items: center; justify-content: space-between; gap: 8px;
  padding-top: 10px; border-top: 1px solid #f4f4f5;
}
.price { font-size: 1.1rem; font-weight: 800; color: var(--brand-dark); }
.price.out { font-size: 0.85rem; color: #ef4444; }
.add-btn {
  background: var(--brand); color: #fff; border: none; padding: 8px 12px;
  border-radius: 8px; font-size: 0.78rem; font-weight: 800; cursor: pointer;
  letter-spacing: 0.2px; transition: 0.15s;
}
.add-btn:hover { background: var(--brand-dark); }
.add-btn:disabled { background: #d4d4d8; cursor: not-allowed; }

/* Sepet Çekmecesi */
.drawer-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.5); z-index: 999;
  display: none; justify-content: flex-end;
}
.drawer-overlay.open { display: flex; }
.drawer {
  background: #fff; width: 100%; max-width: 400px; height: 100%;
  display: flex; flex-direction: column;
}
.drawer-head {
  padding: 16px; background: var(--dark); color: #fff;
  display: flex; justify-content: space-between; align-items: center;
}
.drawer-body { flex: 1; overflow-y: auto; padding: 16px; }
.cart-item {
  display: flex; justify-content: space-between; align-items: center;
  padding: 12px 0; border-bottom: 1px solid var(--border); gap: 10px;
}
.qty-ctrl { display: flex; align-items: center; gap: 6px; }
.qty-btn {
  width: 26px; height: 26px; border: 1px solid var(--border); background: #f4f4f5;
  border-radius: 6px; font-weight: 800; cursor: pointer;
}
.drawer-foot { padding: 16px; border-top: 1px solid var(--border); background: #fafafa; }
.wa-order-btn {
  width: 100%; background: var(--wa); color: #fff; border: none; padding: 14px;
  border-radius: 10px; font-size: 1rem; font-weight: 800; cursor: pointer; margin-top: 12px;
}

/* Footer */
footer { background: var(--dark); color: #e4e4e7; padding: 32px 16px; font-size: 0.88rem; }
.footer-inner {
  max-width: 1280px; margin: auto; display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 24px;
}
footer h4 { color: var(--brand); margin-bottom: 8px; font-size: 1rem; }

@media(max-width: 720px) {
  .hero { grid-template-columns: 1fr; }
  .banner-card { height: 165px; }
  .wa-top { display: none; }
}
</style>
</head>
<body>

<div class="admin-bar">
